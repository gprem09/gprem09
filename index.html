<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b12">
  <title>Arcana // Hand Powers</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" id="app">
    <canvas id="fxCanvas" aria-hidden="true"></canvas>
    <div class="noise" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">A</span>
        <span>ARCANA <b>//</b> 09</span>
      </div>
      <div class="privacy" id="privacyIndicator">
        <span class="privacy-dot"></span>
        <span id="privacyText">CAMERA OFFLINE</span>
      </div>
    </header>

    <section class="stage" aria-label="Hand tracking stage">
      <div class="camera-frame" id="cameraFrame">
        <video id="webcam" autoplay muted playsinline></video>
        <canvas id="trackingCanvas" aria-hidden="true"></canvas>
        <div class="scan-line" aria-hidden="true"></div>

        <div class="stage-empty" id="stageEmpty">
          <div class="target">
            <span class="corner tl"></span><span class="corner tr"></span>
            <span class="corner bl"></span><span class="corner br"></span>
            <div class="target-rings"></div>
            <div class="target-hand">⌁</div>
          </div>
          <p>AWAITING BIOMETRIC LINK</p>
          <button class="start-button" id="startCamera">
            <span class="button-icon">◉</span>
            <span>START CAMERA</span>
          </button>
        </div>

        <div class="loading-state" id="loadingState" hidden>
          <div class="loader"></div>
          <p id="loadingText">Initializing vision system</p>
        </div>

        <div class="error-state" id="errorState" hidden>
          <span class="error-icon">!</span>
          <p id="errorText">Camera unavailable</p>
          <button class="retry-button" id="retryCamera">TRY AGAIN</button>
        </div>

        <div class="corner-label top-left">CAM_01</div>
        <div class="corner-label bottom-right" id="fpsLabel">-- FPS</div>
      </div>
    </section>

    <aside class="status-panel">
      <div class="panel-kicker">VISION STATUS</div>
      <div class="gesture-readout">
        <span class="readout-index">01</span>
        <div>
          <span class="readout-label">CURRENT SIGNAL</span>
          <strong id="gestureName">STANDBY</strong>
        </div>
      </div>
      <div class="signal-bars" id="signalBars">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="confidence">
        <span>TRACKING CONFIDENCE</span>
        <b id="confidenceValue">0%</b>
      </div>
      <div class="confidence-track"><span id="confidenceBar"></span></div>
    </aside>

    <nav class="gesture-legend" aria-label="Gesture controls">
      <button class="gesture-card active" data-gesture="standby">
        <span class="gesture-icon standby-icon"></span>
        <span><b>STANDBY</b><small>NO HAND</small></span>
      </button>
      <button class="gesture-card" data-gesture="palm">
        <span class="gesture-icon palm-icon">✋</span>
        <span><b>OPEN PALM</b><small>FORCE AURA</small></span>
      </button>
      <button class="gesture-card" data-gesture="fist">
        <span class="gesture-icon fist-icon">✊</span>
        <span><b>CLOSED FIST</b><small>IMPACT BURST</small></span>
      </button>
      <button class="gesture-card" data-gesture="pinch">
        <span class="gesture-icon pinch-icon">☝</span>
        <span><b>PINCH</b><small>LIGHTNING</small></span>
      </button>
      <button class="gesture-card" data-gesture="point">
        <span class="gesture-icon point-icon">☝</span>
        <span><b>POINT</b><small>PROJECTILE</small></span>
      </button>
    </nav>

    <button class="stop-button" id="stopCamera" hidden>
      <span></span> STOP CAMERA
    </button>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
